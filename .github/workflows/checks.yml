name: Checks

# Fast, Docker-free checks that gate a change before the build. Currently: the
# openg2p-pbms-platform pin must stay in lockstep across the Dockerfiles and the
# Helm chart dependency (test/test_pbms_pin_lockstep.py). Runs in parallel with
# build-publish.yml.

on:
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pytest
      - name: openg2p-pbms-platform pin lockstep
        run: python -m pytest test/test_pbms_pin_lockstep.py -q
